[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-quantum-resource-mapper"
version = "0.2.0"
description = "Task profiling and classical/hybrid/redesign resource mapping for hybrid quantum-classical computing"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2,<3",
    "qiskit-ibm-runtime",  # fake backends only
    "qiskit-aer",
    "networkx",
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",  # Phase 2 resource models
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["hybrid_mapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
