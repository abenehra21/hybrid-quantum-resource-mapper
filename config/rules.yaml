# Every decision threshold lives here. Editing this file changes behaviour; no code edits needed.

# R2: classical statevector simulation is feasible if 16 * 2^n bytes fits in this budget.
# 16 GiB <=> n_qubits <= 30.
statevector_memory_gib: 16

# R3: low entanglement if the circuit's entanglement bound (two-qubit gates crossing any cut of the
# qubit line, capped by the smaller side, in ebits) is at most this. Exact MPS then needs bond
# dimension <= 2^12 = 4096. The profiler computes the bound from the logical circuit (no transpile).
low_entanglement_max_ebits: 12

# R6: minimum estimated circuit fidelity per algorithm kind.
fidelity_min:
  expect: 0.05     # expectation values: mitigation overhead ~1/F^2 explodes below this
  sample: 0.01     # sampling: need enough good bitstrings among the noise
  recover: 1.0e-4  # SQD-style: classical post-processing recovers signal from noisy samples

# Default problem/hardware fields for profiles built from generated workloads.
workload_defaults:
  precision_target: 1.0e-3
  deadline_min: 480
  queue_wait_min: 60
  shot_budget: 1.0e+7
  samples_needed: 100000   # sample-kind algorithms (qaoa, samp)

# baselines.py: small-instance simulation settings.
baselines:
  vqe_reps: 1                    # efficient-SU2 layers for the hybrid VQE runs
  optimizer_max_iter: 100        # SPSA iteration cap (hybrid)
  optimizer_max_iter_quick: 40
  spsa_calibration_steps: 5      # gradient samples used to set the SPSA learning rate
  spsa_target_step: 0.6          # calibrated size (rad) of the first parameter update
  spsa_perturbation: 0.2          # SPSA finite-difference step; must beat shot noise
  estimator_precision: 0.05      # VQE: shots per measurement group = ceil(1/precision^2)
  sampler_shots: 512             # QAOA shots per evaluation
  success_rel_error: 0.05        # a run "succeeds" if |result - exact| <= 5% of |exact|
  seed: 7

# Energy attribution (report.py / baselines.py). ASSUMED placeholder figures: replace with
# measured values for your site. QPU power is attributed by share of QPU time, because the
# cryostat and control electronics draw power whether or not a job is running.
energy:
  classical_node_watts: 300
  qpu_system_watts: 25000

# Oracle cost J = w_time*projected_runtime_s + w_energy*energy_j + w_qpu*qpu_seconds,
# minimised over the strategies that meet the accuracy target.
oracle_weights:
  w_time: 1.0
  w_energy: 0.001
  w_qpu: 10.0
